name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:property
      - run: npm run audit:public
      - name: Attest supported release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish supported release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          main.js manifest.json styles.css
          --title "Stateful Git Sync $GITHUB_REF_NAME"
          --notes "Fixes the Resume/Preview recovery loop. Recovery now reports specific blocking conditions and keeps network retries in Resume. Confirmed published adoption without local writes can complete its verified snapshot BASE after another device advances main, preserving later edits for normal conflict review. Unconfirmed adoption, local-write checks, backups and verification remain protected. 修复 Resume 与 Preview 互相跳转；恢复失败显示具体原因。已确认发布且无本地写入的接管事务可在远端推进后完成原快照校验，保留后续编辑供新 Preview 审阅。728 tests, TypeScript, standard and Obsidian lint, mobile-safe build, and isolated Obsidian recovery/lifecycle regressions passed."
