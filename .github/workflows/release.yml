name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:property
      - run: npm run audit:public
      - name: Attest supported release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish supported release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          main.js manifest.json styles.css
          --title "Stateful Git Sync $GITHUB_REF_NAME"
          --notes "Fixes published Recovery blocked by unexpected Local changes. Resume names affected files and offers an explicit Start fresh Preview from current HEAD action after local mismatches. The action verifies the transaction and current remote state, retains verified backups of current Local bytes and an audit, keeps files and BASE unchanged, and returns to normal explicit conflict review. It does not replay old writes or record interrupted work as successful. Prepared/identity/scope/history/backup checks remain protected. 修复移动端因本地文件差异卡在 Resume 的情况：显示具体文件，提供安全重新 Preview 入口；保留当前文件、原 BASE、事务与备份，冲突仍须明确选边。751 tests, TypeScript, both lint configurations, mobile-safe build, and isolated Obsidian Recovery/lifecycle regressions passed."
